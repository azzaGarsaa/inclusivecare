# Local development infrastructure. Ports are offset to avoid clashing with
# services that may already run on the host (PostgreSQL on 5432, etc.).
services:
  postgres:
    image: postgis/postgis:17-3.5
    environment:
      POSTGRES_USER: inclusivecare
      POSTGRES_PASSWORD: inclusivecare
      POSTGRES_DB: inclusivecare
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U inclusivecare -d inclusivecare"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every outgoing email in development. Inbox UI: http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  postgres-data:
